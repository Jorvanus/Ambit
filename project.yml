name: Ambit
options:
  bundleIdPrefix: com.aarongbaxter
  xcodeVersion: "2700"
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: 337KNRL5L8
    CODE_SIGN_STYLE: Automatic
targets:
  Ambit:
    type: application
    platform: iOS
    sources:
      - path: Ambit
      - path: Shared
    dependencies:
      - target: AmbitShare
    entitlements:
      path: Ambit/Ambit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aarongbaxter.AmbitTrips
    info:
      path: Ambit/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarongbaxter.AmbitTrips
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  AmbitShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AmbitShare
      - path: Shared
    entitlements:
      path: AmbitShare/AmbitShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aarongbaxter.AmbitTrips
    info:
      path: AmbitShare/Info.plist
      properties:
        CFBundleDisplayName: Ambit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarongbaxter.AmbitTrips.Share
        SKIP_INSTALL: YES
  AmbitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Ambit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarongbaxter.AmbitTripsTests
        GENERATE_INFOPLIST_FILE: YES
