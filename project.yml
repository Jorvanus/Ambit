name: Ambit
options:
  bundleIdPrefix: com.jorvanus
  xcodeVersion: "2700"
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: ""
targets:
  Ambit:
    type: application
    platform: iOS
    sources:
      - path: Ambit
    info:
      path: Ambit/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorvanus.Ambit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  AmbitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Ambit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorvanus.AmbitTests
        GENERATE_INFOPLIST_FILE: YES
